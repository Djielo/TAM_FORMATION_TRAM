<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1a3a52" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta
      name="description"
      content="Pré-examen et examen final — Règlement de Circulation Tramway TaM (RCT EXP-CSG-01-17)"
    />
    <title>RCT — Règlement de Circulation Tramway TaM</title>
    <link rel="icon" href="favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="favicon.png" />
    <link rel="stylesheet" href="css/app.css" id="app-css" />
    <script>
      window.__RCT_BUST__ = String(Date.now());
    </script>
    <script src="js/modules-manifest.js"></script>
    <script>
      (function () {
        var bust = window.__RCT_BUST__;
        document.getElementById("app-css").href = "css/app.css?v=" + bust;

        /** Import map : chaque import relatif sous /js/ reçoit ?v=bust. */
        var jsScope = new URL("js/", location.href).href;
        var scopeEntries = {};
        var list = window.__RCT_JS_MODULES__ || [];
        for (var i = 0; i < list.length; i++) {
          var file = list[i];
          scopeEntries["./" + file] = "./" + file + "?v=" + bust;
        }

        var im = document.createElement("script");
        im.type = "importmap";
        im.textContent = JSON.stringify({ scopes: {} });
        var map = { scopes: {} };
        map.scopes[jsScope] = scopeEntries;
        im.textContent = JSON.stringify(map);
        document.head.appendChild(im);
      })();
    </script>
  </head>
  <body>
    <div id="app" class="app" aria-live="polite">
      <p class="footer-note">Chargement…</p>
    </div>
    <script type="module">
      const s = document.createElement("script");
      s.type = "module";
      s.src = "js/boot.js?v=" + window.__RCT_BUST__;
      document.body.appendChild(s);
    </script>
  </body>
</html>
